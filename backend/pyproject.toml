[project]
name = "agentic-subscription-manager"
version = "0.1.0"
description = "Authenticated, read-only account LangGraph AI service for Agent Cost Control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.15,<5",
    "composio==0.30.0",
    # The SDK pins this prerelease; declaring it explicitly keeps uv's default resolver usable.
    "composio-client==2.0.0rc19",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "pydantic>=2.10,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.uv]
# OneDrive rejects package-cache hardlinks; copying also works on ordinary filesystems.
link-mode = "copy"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[project.scripts]
agentic-subscription-manager = "agentic_subscription_manager:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
