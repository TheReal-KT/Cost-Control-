name: Verify Android and Gmail backend

on:
  push:
    branches:
      - audit/gmail-subscription-ci-20261030
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verify backend contracts
        run: uv run --locked python -B -m unittest discover -s tests -v
      - name: Ruff lint
        run: uv run --locked ruff check src tests main.py
      - name: Ruff format
        run: uv run --locked ruff format --check src tests main.py

  android:
    name: Android debug build, JVM tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Android source and JVM tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
